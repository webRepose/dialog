<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/speak.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Интерактивный симулятор профессиональной коммуникации в сфере логистики.
      Карагандинский университет Казпотребсоюза Лапина И.В (Development by Агалаков Д.В)"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/speak.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Интерактивный симулятор профессиональной коммуникации в сфере логистики</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

         <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((reg) => console.log(reg.scope));
        });
      }
    </script>
  </body>
</html>
